name: Update README cards

on:
  schedule:
    - cron: "0 3 1 * *"
  push:
    branches: [main]
    paths: [".github/workflows/readme-cards.yml"]
  workflow_dispatch:

permissions:
  contents: write

env:
  # Set the STATS_TOKEN secret (PAT with `repo` and `read:user`) to include private contributions.
  TOKEN: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Generate stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&hide_border=true&include_all_commits=true&count_private=true
          path: profile/stats.svg
          token: ${{ env.TOKEN }}
          fail_on_error: true

      - name: Generate top languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&hide_border=true&hide=jupyter%20notebook,tex,bibtex%20style
          path: profile/top-langs.svg
          token: ${{ env.TOKEN }}
          fail_on_error: true

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "Update README cards" || exit 0
          git push
